<!DOCTYPE html>

<body class="page page-api">

            <nav aria-label="Main navigation">

        <section class="about-card">
            <p class="eyebrow">API page</p>
            <h2>Guestbook API</h2>
            <p>Read, create, update, and delete guestbook entries for logged-in users.</p>

            <div class="info-grid">
                <article class="info-item">
                    <h3>Read</h3>
                    <p>GET /api/guestbook</p>
                </article>
                <article class="info-item">
                    <h3>Create</h3>
                    <p>POST /api/guestbook</p>
                </article>
                <article class="info-item">
                    <h3>Update / Delete</h3>
                    <p>PUT /api/guestbook/:id and DELETE /api/guestbook/:id</p>
                </article>
            </div>
        </section>
    </main>
