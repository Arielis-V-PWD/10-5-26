            <h2>Visitor Stats API</h2>
            <p>Returns the current visit count for the public-facing pages.</p>

            <div class="info-grid">
                <article class="info-item">
                    <h3>Endpoint</h3>
                    <p><strong>GET /api/stats</strong></p>
                </article>
                <article class="info-item">
                    <h3>Response</h3>
                    <p>{ "visitorCount": 42 }</p>
                </article>
                <article class="info-item">
                    <h3>Notes</h3>
                    <p>Uses a no-store cache header so the count stays fresh.</p>
